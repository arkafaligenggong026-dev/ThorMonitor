<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Offline — ThorMonitor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1F2937;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 1px 3px rgba(15,23,42,0.08);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #00A2E9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: white;
      font-size: 28px;
      font-weight: 700;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #64748B; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #00A2E9;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">T</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Anda sedang berada di area tanpa sinyal (blank spot). Halaman yang sudah pernah dibuka tetap bisa diakses. Coba lagi setelah tersambung ke internet.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
